<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111310">
  <meta name="description" content="Номерной — выбивай красивые автономера, собирай коллекцию и торгуй на игровом рынке. Бесплатная браузерная игра.">
  <title>Номерной — твоя коллекция удачи</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=20261013-5">
  <script type="module" src="./app.js?v=20261013-5"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Основная навигация">
      <a class="brand" href="#roll" aria-label="Номерной — главная"><span class="brand-mark">н<span>·</span></span><span>НОМЕРНОЙ<small>КЛУБ КРАСИВЫХ НОМЕРОВ</small></span></a>
      <div class="sidebar-label">ТВОЯ ТЕРРИТОРИЯ</div>
      <nav class="desktop-nav" id="desktop-nav"></nav>
      <div class="sidebar-mission"><span class="tiny-icon" data-icon="flag"></span><span class="eyebrow">ПЕРВАЯ ПЕРЕДАЧА</span><h3>Поймай свою удачу</h3><p>Выбей 5 номеров и получи<br><b>10 000 ₽</b> в награду</p><div class="progress-track"><i id="mission-progress"></i></div><div class="mission-bottom"><span id="mission-count">0 из 5 номеров</span><button id="mission-claim" class="text-button" disabled>Забрать ↗</button></div></div>
      <div class="sidebar-bottom"><span class="status-dot"></span> Всё сохранено на устройстве<button class="icon-button" id="help-button" aria-label="Как играть" data-icon="help"></button></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="breadcrumb"><span>Клуб Номерной</span><span class="slash">/</span><b id="page-breadcrumb">Выбить номер</b></div><a href="#roll" class="mobile-brand">н<span>·</span></a><div class="header-actions"><button class="sound-button icon-button" id="sound-button" aria-label="Включить звук" title="Включить звук"></button><div class="wallet"><span class="wallet-icon" data-icon="wallet"></span><div><small>ТВОЙ БАЛАНС</small><strong id="balance">150 000 <span>₽</span></strong></div><button id="wallet-bonus" class="wallet-plus" aria-label="Ежедневная награда">+</button></div><button class="avatar" id="profile-button" aria-label="Моя статистика">М<span></span></button></div></header>
      <main id="main" tabindex="-1"></main>
      <footer class="footer"><span>© <span id="year"></span> Номерной <i>·</i> Коллекционируй характер.</span><button class="text-button" id="footer-help">Об игре <span>↗</span></button><span class="game-note">Игровые номера. Виртуальные ₽.</span></footer>
    </div>
  </div>
  <nav class="mobile-nav" id="mobile-nav" aria-label="Мобильная навигация"></nav>
  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
  <dialog id="modal" class="modal"><div id="modal-content"></div></dialog>
  <div id="confetti" class="confetti" aria-hidden="true"></div>
  <noscript><div class="noscript">Для игры включи JavaScript в браузере.</div></noscript>
</body>
</html>
